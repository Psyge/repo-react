<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070d" />

    <!--
      HUOM: nämä OVAT link-tageja, eivät pelkkiä osoitteita.
      Jos tagit poistaa ja jättää pelkän osoiterivin, selain tulkitsee sen
      tekstisisällöksi, sulkee <head>:n siihen kohtaan ja aloittaa <body>:n
      — jolloin title, meta-kuvaus ja skriptit valuvat bodyyn ja favicon,
      apple-touch-icon sekä manifest katoavat.

      Kuvakkeet: favicon.ico (16/32/48 px) selainvälilehdelle, 192 px PNG
      tarkkoja näyttöjä varten, 180 px apple-touch-icon iPhonen kotinäytölle.
      192/512 px ja maskable-versio ovat manifest.json:ssa (Android, asennus).
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="preconnect" href="https://services.swpc.noaa.gov" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />

    <title>RepoTracker | Northern Lights Forecast Finland</title>

    <meta
      name="description"
      content="Live Northern Lights forecast, Kp index, solar wind and aurora map for Finland and Lapland."
    />
    <!-- Premium-aktivointi: token ja Stripen session_id pois osoiteriviltä
         ENNEN kuin Google Tag Manager / AdSense latautuvat. Muuten ne
         päätyisivät Analyticsin sivunäkymään (page_location), ja kuka tahansa
         GA-raportteja katsova voisi aktivoida toisen ostaman premiumin.
         Arvot siirretään sessionStorageen, josta PremiumSuccessPage lukee
         ne — näin myös sivun päivitys toimii. Pidä tämä ensimmäisenä
         skriptinä. -->
    <script>
      (function () {
        try {
          var l = window.location;
          if (l.pathname.indexOf("/premium-success") !== 0) return;
          var q = new URLSearchParams(l.search);
          var h = new URLSearchParams(l.hash.replace(/^#/, ""));
          var token = h.get("token") || q.get("token");
          var sessionId = q.get("session_id");
          if (!token && !sessionId) return;
          sessionStorage.setItem("rt_activation", JSON.stringify({ token: token, sessionId: sessionId }));
          history.replaceState(null, "", l.pathname);
        } catch (e) { /* sessionStorage estetty → sivu lukee URL:n itse */ }
      })();
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1393421309906207"
     crossorigin="anonymous"></script>
    <!-- Google Consent Mode -->
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        personalization_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
        wait_for_update: 500
      });
    </script>

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];

        w[l].push({
          "gtm.start": new Date().getTime(),
          event: "gtm.js"
        });

        var f = d.getElementsByTagName(s)[0];
        var j = d.createElement(s);
        var dl = l !== "dataLayer" ? "&l=" + l : "";

        j.async = true;
        j.src =
          "https://www.googletagmanager.com/gtm.js?id=" + i + dl;

        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-5TL6KCK2");
    </script>
    <!-- End Google Tag Manager -->
  </head>

  <body>

    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-5TL6KCK2"
        height="0"
        width="0"
        style="display: none; visibility: hidden"

      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div id="root"></div>

    <!-- Cloudflare Turnstile -->

    ></script>

</html>
