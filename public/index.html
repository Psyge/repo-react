<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!--
      HUOM: nämä kolme OVAT link-tageja, eivät pelkkiä osoitteita.
      Jos tagit poistaa ja jättää pelkän "%PUBLIC_URL%/iconi.png" -rivin,
      selain tulkitsee sen tekstisisällöksi, sulkee <head>:n siihen kohtaan
      ja aloittaa <body>:n — jolloin title, meta-kuvaus ja skriptit valuvat
      bodyyn ja favicon, apple-touch-icon sekä manifest katoavat.
    -->
    <link rel="icon" href="%PUBLIC_URL%/iconi.png" />
    <!-- Osoitti aiemmin logo192.png:ään, joka on yhä Create React Appin
         oletuslogo (Reactin atomi) — kotinäytölle lisätty RepoTracker näytti
         siis Reactin logoa. Vaihda tämä oikeaan 180x180 px kuvakkeeseen kun
         sellainen on tehty. -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/iconi.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin />
    <link rel="preconnect" href="https://services.swpc.noaa.gov" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />

    <title>RepoTracker | Northern Lights Forecast Finland</title>

    <meta
      name="description"
      content="Live Northern Lights forecast, Kp index, solar wind and aurora map for Finland and Lapland."
    />

    <!-- Google Consent Mode -->
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        personalization_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
        wait_for_update: 500
      });
    </script>

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];

        w[l].push({
          "gtm.start": new Date().getTime(),
          event: "gtm.js"
        });

        var f = d.getElementsByTagName(s)[0];
        var j = d.createElement(s);
        var dl = l !== "dataLayer" ? "&l=" + l : "";

        j.async = true;
        j.src =
          "https://www.googletagmanager.com/gtm.js?id=" + i + dl;

        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-5TL6KCK2");
    </script>
    <!-- End Google Tag Manager -->
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-5TL6KCK2"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

    <!-- Cloudflare Turnstile -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
  </body>
</html>
